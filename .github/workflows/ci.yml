name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.6.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Godot (headless)
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot4
          godot4 --version
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import the Godot library project
        run: godot4 --headless --path godot --import || true
      - name: Tests (compiler, studio, sprites, playtester, cockpit, GDScript suite)
        # The live-LLM tests need a GPU model server; web-export tests skip without export templates.
        run: pytest -m "not llm" -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Godot (headless)
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot4
      - name: Build the wheel
        run: pip wheel . --no-deps -w dist
      - name: Install it in a clean environment and build an example outside the repository
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          mkdir /tmp/play && cd /tmp/play
          /tmp/venv/bin/spawnpoint examples copy pixel_hopper
          /tmp/venv/bin/spawnpoint build pixel_hopper.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
