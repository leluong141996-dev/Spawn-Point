[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawnpoint"
version = "0.1.0"
description = "Compile JSON game graphs into juicy, runnable Godot 4 projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.5", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
spawnpoint = "spawnpoint.cli:main"

[tool.setuptools.packages.find]
where = ["compiler"]

[tool.setuptools.package-data]
spawnpoint = ["py.typed", "cockpit/static/*"]

[tool.pytest.ini_options]
testpaths = ["compiler/tests"]
markers = ["llm: needs a running OpenAI-compatible LLM server (deselect with -m 'not llm')"]
